<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>PetFeeder</title>
  <meta name="description" content="Controle remoto do comedouro automático" />
  <meta name="theme-color" content="#FF6B2C" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="badge-mark" aria-hidden="true">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="4" r="2" />
          <circle cx="18" cy="8" r="2" />
          <circle cx="20" cy="16" r="2" />
          <path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z" />
        </svg>
      </span>
      <span class="wordmark">PetFeeder</span>
    </div>
  </header>

  <div class="app-shell">
    <p class="status-line">
      <span id="app-conn-status" class="status-chip" data-state="connecting">
        <span class="dot"></span><span id="app-conn-text">App: conectando...</span>
      </span>
      <span id="device-conn-status" class="status-chip" data-state="unknown">
        <span class="dot"></span><span id="device-conn-text">Comedouro: ?</span>
      </span>
    </p>

    <main>
      <section class="card hero-card">
        <h1 class="section-label">Despejo</h1>

        <button id="btn-dispense" type="button" class="btn-dispense">
          Dispensar agora
        </button>
        <p id="dispense-feedback" class="feedback" aria-live="polite"></p>
      </section>

      <section class="card schedule-card">
        <h2 class="section-label">Agenda</h2>

        <ul id="schedule-list" class="schedule-list"></ul>

        <p id="schedule-empty" class="empty-state">
          Nenhum horário ainda. Toque em &ldquo;Novo horário&rdquo; para começar.
        </p>

        <form id="new-schedule-form" class="add-row hidden">
          <input
            type="time"
            id="input-time"
            required
            aria-label="Horário do novo agendamento"
          />
          <button type="submit" class="btn-text">Adicionar</button>
          <button type="button" id="btn-cancel-new" class="btn-text btn-text--muted">
            Cancelar
          </button>
        </form>

        <button type="button" id="btn-new" class="add-trigger">
          <span aria-hidden="true">+</span> Novo horário
        </button>

        <p id="schedule-footer" class="footer-note hidden"></p>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
